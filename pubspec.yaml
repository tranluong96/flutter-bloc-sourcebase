name: my_app
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  getwidget: ^7.0.2
  flutter_spinkit: ^5.2.2

  # Utility
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_dotenv: ^6.0.1
  intl: ^0.20.3
  slang: ^4.7.0
  slang_flutter: ^4.7.0
  shared_preferences: ^2.5.5
  get_it: ^9.2.1
  injectable: ^3.0.0
  auto_route: ^11.1.0
  permission_handler: ^12.0.3
  equatable: ^2.1.0
  awesome_extensions: ^2.1.0
  rxdart: 0.28.0
  provider: ^6.1.5+1

  # Net
  dio: ^5.10.0
  retrofit: ^4.9.2
  uuid: ^4.5.1

  # Architecture
  flutter_bloc: ^9.1.1
  json_annotation: ^4.12.0
  freezed_annotation: ^3.1.0
  freezed: ^3.2.5
  keyboard_dismisser: 3.0.0

  #Firebase
  flutter_local_notifications: ^22.0.1
  firebase_messaging: ^16.4.1
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  firebase_crashlytics: ^5.2.4
  firebase_analytics: ^12.4.3
  dartx: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  retrofit_generator: ^10.2.7
  build_runner: ^2.15.1
  json_serializable: ^6.14.0
  injectable_generator: ^3.0.2
  auto_route_generator: ^10.5.0
  analyzer: ^10.0.1
  dart_style: ^3.1.7

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - .env
  fonts:
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Black.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
        - asset: assets/fonts/NotoSansJP-Light.ttf
        - asset: assets/fonts/NotoSansJP-Medium.ttf
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Thin.ttf
