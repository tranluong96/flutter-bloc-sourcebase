name: my_app
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  getwidget: 6.0.0
  flutter_spinkit: 5.2.0

  # Utility
  flutter_screenutil: 5.9.0
  cached_network_image: 3.3.1
  flutter_dotenv: 5.1.0
  intl: 0.20.2
  shared_preferences: 2.2.2
  get_it: 7.6.7
  injectable: 2.3.2
  auto_route: 7.9.2
  permission_handler: 11.3.0
  equatable: 2.0.5
  easy_localization: 3.0.7+1
  awesome_extensions: 2.0.21
  rxdart: 0.28.0
  provider: 6.1.5

  # Net
  dio: 5.8.0+1
  retrofit: 4.1.0

  # Architecture
  flutter_bloc: 8.1.4
  json_annotation: 4.8.1
  freezed_annotation: 2.4.1
  freezed: 2.4.7
  keyboard_dismisser: 3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: 3.0.1
  retrofit_generator: 8.0.6
  build_runner: 2.4.13
  json_serializable: 6.7.1
  injectable_generator: 2.4.1
  auto_route_generator: 7.3.2
  analyzer: 6.11.0
  dart_style: 2.3.8

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/locales/
    - .env
    
  fonts:
    - family: Noto Sans JP
      fonts:
        - asset: assets/fonts/NotoSansJP-Black.ttf
        - asset: assets/fonts/NotoSansJP-Bold.ttf
        - asset: assets/fonts/NotoSansJP-Light.ttf
        - asset: assets/fonts/NotoSansJP-Medium.ttf
        - asset: assets/fonts/NotoSansJP-Regular.ttf
        - asset: assets/fonts/NotoSansJP-Thin.ttf
